name: Terraform Plan and Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to target
        required: true
        type: choice
        options: [dev, stage, prod]
      apply:
        description: Apply the generated plan after approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_environment: ${{ inputs.environment }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_vnet_cidr: ${{ vars.VNET_CIDR }}
  TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Authenticate to Azure with OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=azure-secure-platform/${{ inputs.environment }}.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
      - name: Generate plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Upload reviewed plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.sha }}
          path: tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply ${{ inputs.environment }}
    if: inputs.apply
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.sha }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Authenticate to Azure with OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=azure-secure-platform/${{ inputs.environment }}.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
      - name: Apply exact reviewed plan
        run: terraform apply -input=false -auto-approve tfplan
